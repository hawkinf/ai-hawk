[project]
name = "ai-hawk"
version = "0.2.0"
description = "Servidor de IA multi-provedor com API compativel com OpenAI"
requires-python = ">=3.10"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "BLE",  # blind except
    "RUF",  # ruff
]
ignore = [
    "E501",  # comprimento tratado pelo formatter
    "B008",  # Depends()/Header() no default e o padrao do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
